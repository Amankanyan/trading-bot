name: Kalshi Trading Bot

# Runs the bot continuously inside one job for up to ~6h (GitHub's hard cap
# for hosted runners), then the schedule below starts a fresh run so the
# bot is back up within minutes. concurrency + cancel-in-progress:false
# means a new scheduled run queues behind a still-running one instead of
# starting a second bot in parallel.
#
# Cadence is capped by the-odds-api's free tier (500 requests/month): each
# cycle costs 12 credits (one per configured league), and the hosted
# runner's ~6h hard job limit means every cron firing only ever completes
# ONE cycle before being killed — it never survives to reach its own
# internal sleep-and-loop, so cron frequency (not CYCLE_SLEEP_SECONDS) is
# the real cadence lever. The local Mac instance that used to share this
# same odds-api key has been permanently stopped, so the full quota is
# available to this cloud job alone now. 9 firings/week (7 daily + 2 extra)
# x 12 credits x ~4.3 weeks/month ≈ 465/month — close to the 500 budget
# while still leaving headroom for occasional manual workflow_dispatch
# runs, without the day-of-month drift a "every N days" cron pattern gets
# at month boundaries.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * 1,4"
  workflow_dispatch: {}

concurrency:
  group: kalshi-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: "my kalshi bot"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Kalshi private key
        run: |
          cat > private_key.pem <<'EOF'
          ${{ secrets.KALSHI_PRIVATE_KEY }}
          EOF

      - name: Run trading engine
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_KEY_PATH: private_key.pem
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Both default to the SAFE state (demo exchange, orders disabled)
          # unless a repo variable explicitly overrides them. Repo Settings >
          # Secrets and variables > Actions > Variables.
          KALSHI_ENV: ${{ vars.KALSHI_ENV || 'demo' }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
        run: python main.py

      # Runs even if the job above was cancelled by the timeout, so the
      # next scheduled run resumes from the latest known position state.
      - name: Persist position state
        if: always()
        run: |
          rm -f private_key.pem
          git config user.name "kalshi-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in active_positions_demo.json active_positions_prod.json paper_trades_demo.json paper_trades_prod.json; do
            git add "$f" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update position state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
